openapi: 3.1.0
info:
  title: SisTer-Praxis API
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        '200': {description: healthy}
  /evaluation-contracts:
    get:
      responses:
        '200': {description: list contracts}
    post:
      responses:
        '201': {description: contract created}
  /assessments:
    get:
      responses:
        '200': {description: list assessments}
    post:
      responses:
        '201': {description: assessment recorded}
  /decisions:
    get:
      responses:
        '200': {description: list decisions}
    post:
      responses:
        '201': {description: governed decision recorded}
  /audit/events:
    get:
      responses:
        '200': {description: append-only audit events}
