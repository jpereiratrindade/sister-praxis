openapi: 3.1.0
info:
  title: SisTer-Praxis API
  version: 0.2.2
  description: API surface for Praxis Core and governed transformation runtime. A0-R2-UI executes the web overview, health and service discovery; mutation/readback resources remain declarative until later governed slices.
paths:
  /:
    get:
      responses:
        '200': {description: Praxis web overview}
  /health:
    get:
      responses:
        '200': {description: healthy}
  /evaluation-contracts:
    get:
      responses:
        '200': {description: list contracts}
    post:
      responses:
        '201': {description: contract created}
  /assessments:
    get:
      responses:
        '200': {description: list assessments}
    post:
      responses:
        '201': {description: assessment recorded}
  /decisions:
    get:
      responses:
        '200': {description: list decisions}
    post:
      responses:
        '201': {description: governed decision recorded}
  /services:
    get:
      responses:
        '200': {description: list registered transformation services}
  /services/{service_id}/runs:
    parameters:
      - in: path
        name: service_id
        required: true
        schema: {type: string}
    post:
      responses:
        '202': {description: transformation accepted for execution}
  /runs/{run_id}:
    parameters:
      - in: path
        name: run_id
        required: true
        schema: {type: string}
    get:
      responses:
        '200': {description: transformation receipt and current run state}
  /audit/events:
    get:
      responses:
        '200': {description: append-only audit events}
